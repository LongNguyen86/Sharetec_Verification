version: '3.8'

services:
  bsdc-app:
    build: .
    container_name: bsdc_ingest_engine
    ports:
      - "5678:5678"
    environment:
      - NODES_EXCLUDE=[]
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://161.118.198.37:5678/
    volumes:
      # Mount current directory to container app directory for live updates
      - .:/home/node/app
      # Mount workspace directory to preserve SQLite database and generated output
      - ./workspace:/home/node/app/workspace
      # Mount n8n data directory to preserve n8n workflows and credentials
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
volumes:
  n8n_data: