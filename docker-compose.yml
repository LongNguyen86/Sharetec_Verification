version: '3.8'

services:
  bsdc-app:
    build: .
    container_name: bsdc_ingest_engine
    ports:
      - "5678:5678"
    environment:
      - NODES_EXCLUDE=[]
    volumes:
      # Mount current directory to container app directory for live updates
      - .:/home/node/app
      # Mount workspace directory to preserve SQLite database and generated output
      - ./workspace:/home/node/app/workspace
    restart: unless-stopped