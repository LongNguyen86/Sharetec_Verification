[project]
name = "bsdc-engine"
version = "1.0.0"
description = "Enterprise Data Ingestion, Rule Mapping, and Conversion Engine for BSDC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "polars>=0.20.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "playwright>=1.42.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.scripts]
bsdc-cli = "src.bsdc_engine.cli:main"