<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharetec Data Verification Procedure Guide — 1st Round</title>
<style>
  :root {
    --blue: #1a3a5c;
    --blue-mid: #2563a8;
    --blue-light: #dbeafe;
    --green: #15803d;
    --green-light: #dcfce7;
    --red: #b91c1c;
    --red-light: #fee2e2;
    --yellow: #92400e;
    --yellow-light: #fef3c7;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --border: #d1d5db;
    --white: #ffffff;
    --shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; background: #f0f4f8; color: #1f2937; }

  /* ─── HEADER ─── */
  #app-header {
    background: var(--blue);
    color: white;
    padding: 12px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  #app-header h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  #app-header .sub { font-size: 11px; opacity: .8; margin-top: 2px; }
  #meta-bar {
    background: #234a72;
    padding: 8px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  #meta-bar label { font-size: 11px; color: #cbd5e1; margin-right: 4px; }
  #meta-bar input, #meta-bar select {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    color: white;
    padding: 3px 7px;
    border-radius: 4px;
    font-size: 12px;
  }
  #meta-bar input::placeholder { color: rgba(255,255,255,.5); }
  #progress-bar-wrap { flex: 1 1 200px; }
  #progress-label { font-size: 11px; color: #93c5fd; margin-bottom: 3px; }
  #progress-bar { height: 8px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
  #progress-fill { height: 100%; background: #4ade80; border-radius: 4px; width: 0%; transition: width .4s; }

  /* ─── TABS ─── */
  #tab-nav {
    background: var(--white);
    border-bottom: 2px solid var(--blue-mid);
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    padding: 6px 12px 0;
    position: sticky;
    top: 104px;
    z-index: 90;
    box-shadow: 0 2px 4px rgba(0,0,0,.06);
  }
  .tab-btn {
    padding: 6px 13px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: var(--gray);
    border-bottom: 3px solid transparent;
    border-radius: 4px 4px 0 0;
    transition: all .15s;
  }
  .tab-btn:hover { background: var(--gray-light); color: var(--blue); }
  .tab-btn.active { color: var(--blue-mid); border-bottom-color: var(--blue-mid); background: var(--blue-light); }
  .tab-btn .badge {
    display: inline-block;
    background: var(--gray);
    color: white;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 10px;
    margin-left: 4px;
  }
  .tab-btn.active .badge { background: var(--blue-mid); }

  /* ─── CONTENT ─── */
  #content { padding: 16px 20px; max-width: 1600px; margin: 0 auto; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .section-card {
    background: white;
    border-radius: 8px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    overflow: hidden;
  }
  .section-header {
    background: var(--blue);
    color: white;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .section-header h2 { font-size: 14px; font-weight: 600; }
  .section-header .chevron { transition: transform .2s; font-size: 14px; }
  .section-header.collapsed .chevron { transform: rotate(-90deg); }
  .section-meta {
    background: #f8faff;
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    font-size: 12px;
    color: #374151;
  }
  .section-meta strong { color: var(--blue); }
  .section-meta .tip { background: var(--yellow-light); border-left: 3px solid #f59e0b; padding: 6px 10px; margin-top: 6px; border-radius: 0 4px 4px 0; }
  .section-meta .general-comments {
    background: #f0fdf4; border-left: 3px solid #16a34a; padding: 6px 10px;
    margin-top: 6px; border-radius: 0 4px 4px 0; color: #166534; font-size: 12px;
  }
  textarea.section-comment {
    width: 100%; min-height: 52px; font-family: inherit; font-size: 12px; color: #374151;
    border: 1px solid #d1d5db; border-radius: 4px; padding: 6px 8px; resize: vertical;
    background: #fafbff; margin-top: 6px; box-sizing: border-box;
  }
  textarea.section-comment:focus { outline: none; border-color: var(--blue-mid); background: white; }
  .section-comment-label { font-size: 11px; font-weight: 600; color: #6b7280; margin-top: 6px; display: block; }
  .section-body { padding: 0; }

  /* ─── SUBSECTION ─── */
  .subsection-title {
    background: #e8f0fe;
    border-left: 4px solid var(--blue-mid);
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 700;
    color: var(--blue);
    margin-top: 1px;
  }

  /* ─── FIELD TABLE ─── */
  .field-table { width: 100%; border-collapse: collapse; }
  .field-table thead tr { background: #f9fafb; border-bottom: 2px solid var(--border); }
  .field-table th {
    padding: 7px 10px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .field-table tbody tr { border-bottom: 1px solid #e5e7eb; }
  .field-table tbody tr:hover { background: #fafbff; }
  .field-table td { padding: 7px 10px; vertical-align: top; }
  .col-table { width: 80px; }
  .col-field { width: 140px; font-weight: 600; color: #111827; }
  .col-stec { width: 130px; font-family: monospace; font-size: 11px; color: #6366f1; }
  .col-comments { min-width: 200px; font-size: 11px; color: #374151; line-height: 1.5; }
  .col-comments code { background: #f0f4f8; padding: 1px 4px; border-radius: 3px; font-size: 10px; }
  .col-mb { width: 130px; }
  .col-status { width: 110px; }
  .col-notes { width: 130px; }
  .col-jira { width: 120px; }
  input.jira-val {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 11px;
    background: var(--gray-light);
    font-family: 'Consolas', monospace;
    transition: border .15s, background .15s;
  }
  input.jira-val:focus { outline: none; border-color: #7c3aed; background: white; box-shadow: 0 0 0 2px rgba(124,58,237,.15); }
  input.jira-val:not(:placeholder-shown) { border-color: #7c3aed; background: #f5f3ff; font-weight: 600; color: #5b21b6; }

  /* ─── INPUTS ─── */
  .mb-grid { display: flex; flex-direction: column; gap: 3px; }
  .mb-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .mb-label { font-size: 10px; color: var(--gray); width: 28px; flex-shrink: 0; }
  input.mb-val {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 11px;
    background: var(--gray-light);
    transition: border .15s, background .15s;
  }
  input.mb-val:focus { outline: none; border-color: var(--blue-mid); background: white; box-shadow: 0 0 0 2px rgba(37,99,168,.15); }

  select.status-sel {
    width: 100%;
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid var(--border);
    background: white;
  }
  select.status-sel option[value=""] { color: var(--gray); }
  select.status-sel.pass { border-color: var(--green); color: var(--green); background: var(--green-light); }
  select.status-sel.fail { border-color: var(--red); color: var(--red); background: var(--red-light); }
  select.status-sel.na { border-color: #9ca3af; color: #6b7280; background: #f9fafb; }
   select.status-sel.cnv { border-color: #d97706; color: #92400e; background: #fffbeb; }

  textarea.notes-ta {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 11px;
    resize: vertical;
    min-height: 40px;
    font-family: inherit;
    background: var(--gray-light);
  }
  textarea.notes-ta:focus { outline: none; border-color: var(--blue-mid); background: white; }

  /* ─── RUN BLOCK ─── */
  .run-label {
    display: inline-block;
    margin-top: 8px;
    margin-bottom: 2px;
    color: #1e3a5f;
    font-weight: 700;
    font-size: 11px;
    background: #dbeafe;
    padding: 2px 7px 2px 5px;
    border-radius: 3px;
    border-left: 3px solid var(--blue-mid);
    letter-spacing: .2px;
  }
  .run-code {
    display: block;
    margin: 3px 0 6px 0;
    background: #0f1e35;
    color: #4a9ede;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 10.5px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
  }

  /* ─── ROUND TOGGLE ─── */
  .round-toggle { display: flex; gap: 4px; }
  .round-toggle input[type=radio] { display: none; }
  .round-toggle label {
    padding: 4px 11px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,.3);
    color: rgba(255,255,255,.65);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    background: rgba(255,255,255,.08);
    user-select: none;
  }
  .round-toggle input[type=radio]:checked + label {
    background: var(--blue-mid);
    border-color: #60a5fa;
    color: white;
    box-shadow: 0 0 0 2px rgba(96,165,250,.35);
  }
  .round-toggle label:hover { background: rgba(255,255,255,.18); color: white; }

  /* row tinting by status */
  tr.row-pass { background: #f0fdf4 !important; }
  tr.row-fail { background: #fff1f2 !important; }
  tr.row-na { background: #f9fafb !important; opacity: .75; }
   tr.row-cnv { background: #fffbeb !important; opacity: .85; }

  /* ─── PRINT BUTTON ─── */
  #toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    padding: 7px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--blue-mid); color: white; }
  .btn-success { background: var(--green); color: white; }
  .btn-outline { background: white; color: var(--blue); border: 2px solid var(--blue-mid); }
  .btn-danger { background: var(--red); color: white; }
  #summary-bar {
    background: white;
    border-radius: 8px;
    padding: 10px 16px;
    display: flex;
    gap: 20px;
    align-items: center;
    box-shadow: var(--shadow);
    font-size: 12px;
    flex-wrap: wrap;
  }
  .stat { display: flex; align-items: center; gap: 5px; }
  .stat-dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-pass { background: var(--green); }
  .dot-fail { background: var(--red); }
  .dot-na { background: #9ca3af; }
   .dot-cnv { background: #d97706; }
  .dot-pending { background: #d1d5db; }

  @media print {
    #tab-nav, #toolbar, #app-header .sub, #progress-bar-wrap { display: none !important; }
    .tab-panel { display: block !important; }
    .section-card { page-break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
    .print-val { display: inline-block !important; white-space: nowrap !important; word-break: normal !important; }
    .print-notes { display: block !important; min-height: 1em; white-space: pre-wrap; word-break: break-word; }
    input.mb-val, select.status-sel, textarea.notes-ta { display: none !important; }
    .mb-item { white-space: nowrap !important; overflow: visible; }
    .mb-label { flex-shrink: 0; }
    /* Fit all columns on printed page (portrait ~720px, landscape ~1000px) */
    /* col widths: 45+80+75+100+100+60+130+130 = 720px */
    .field-table { width: 100% !important; table-layout: fixed !important; font-size: 8px !important; }
    .field-table th, .field-table td { padding: 3px 4px !important; overflow: visible !important; word-wrap: break-word !important; vertical-align: top; }
    .col-table  { width: 45px  !important; min-width: 0 !important; }
    .col-field  { width: 80px  !important; min-width: 0 !important; }
    .col-stec   { width: 75px  !important; min-width: 0 !important; }
    .col-comments { width: 100px !important; min-width: 0 !important; }
    .col-mb     { width: 100px !important; min-width: 0 !important; }
    .col-status { width: 60px  !important; min-width: 0 !important; }
    .col-notes  { width: 130px !important; min-width: 0 !important; white-space: normal !important; word-break: break-word !important; overflow: visible !important; }
    .col-jira   { width: 130px !important; min-width: 0 !important; white-space: normal !important; word-break: break-word !important; overflow: visible !important; }
    .print-notes { white-space: pre-wrap !important; word-break: break-word !important; overflow: visible !important; }
  }
</style>
</head>
<body>

<div id="app-header">
  <h1>📋 Conversion & Merger Verifications</h1>
  <div class="sub">All sections below must be completed and signed off before proceeding to live conversion</div>
</div>

<div id="meta-bar">
  <div><label>Credit Union:</label><input id="cu-name" type="text" placeholder="Enter CU name" style="width:180px"></div>
  <div style="display:flex;align-items:center;">
    <label>Round:</label>
    <div class="round-toggle">
      <input type="radio" name="cu-round" id="r1" value="1st" checked onchange="updateRoundLabel()">
      <label for="r1">1st Round</label>
      <input type="radio" name="cu-round" id="r2" value="2nd" onchange="updateRoundLabel()">
      <label for="r2">2nd Round</label>
      <input type="radio" name="cu-round" id="rl" value="LIVE" onchange="updateRoundLabel()">
      <label for="rl">LIVE</label>
    </div>
  </div>
  <div><label>Conversion Analyst:</label><input id="analyst" type="text" placeholder="Name" style="width:150px"></div>
  <div><label>Date:</label><input id="verif-date" type="date"></div>
  <div id="progress-bar-wrap">
    <div id="progress-label">Overall Progress: 0 / 0 verified (0%)</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>
  <button class="btn btn-success" onclick="window.print()">🖨 Print</button>
  <button class="btn btn-outline" onclick="exportSummary()">📊 Summary</button>
  <button class="btn btn-outline" onclick="saveSession()" title="Save all statuses, notes, values and Jira tickets to a file">💾 Save Session</button>
  <label class="btn btn-outline" style="cursor:pointer;font-weight:600;font-size:12px;font-family:inherit;color:var(--blue);opacity:1;" title="Load a previously saved session file">📂 Load Session<input type="file" accept=".json" style="display:none;" onchange="loadSession(event)"></label>
  <label class="btn btn-outline" style="cursor:pointer;font-weight:600;font-size:12px;font-family:inherit;color:var(--blue);opacity:1;" title="Combine multiple session files from different team members into one">🔀 Merge Sessions<input type="file" accept=".json" multiple style="display:none;" onchange="mergeSessions(event)"></label>
  <button class="btn btn-outline" style="background:#27ae60;color:#fff;border-color:#27ae60;font-weight:600;" onclick="exportToExcel()">⬇ Export to Excel</button>
</div>

<nav id="tab-nav"></nav>

<div id="content">
  <div id="toolbar">
    <div id="summary-bar">
      <div class="stat"><span class="stat-dot dot-pass"></span><strong id="cnt-pass">0</strong> Pass</div>
      <div class="stat"><span class="stat-dot dot-fail"></span><strong id="cnt-fail">0</strong> Fail</div>
      <div class="stat"><span class="stat-dot dot-na"></span><strong id="cnt-na">0</strong> N/A</div>
      <div class="stat"><span class="stat-dot dot-cnv"></span><strong id="cnt-cnv">0</strong> CNV</div>
      <div class="stat"><span class="stat-dot dot-pending"></span><strong id="cnt-pending">0</strong> Pending</div>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button class="btn btn-outline" onclick="expandAll()">Expand All</button>
        <button class="btn btn-outline" onclick="collapseAll()">Collapse All</button>
      </div>
    </div>
  </div>
  <div id="panels"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// DATA  — all verification sections
// ═══════════════════════════════════════════════════════════════════════
const TABS = [
  {
    id: 'progress',
    title: 'Progress Commands',
    sections: [
      {
        title: 'Progress Database Commands',
        directions: 'Use these commands to validate data in Progress before or during verification. Copy the command, open the Progress editor, right-click and paste. If anything unexpected is returned, consult the lead.',
        tip: 'TIP: Right-click in Progress editor to paste a copied command — faster than typing.',
        fields: [
          { table: 'ppd-exp', field: 'Posted Flag Check', stec: 'posted-fl', comments: 'If we converted Prepaid Expenses, the posted-fl must be marked yes for all expenses. This can only be seen in progress. Run the following command in progress:\n\nRun: For each ppd-exp where ppd-exp.cu = 1 and posted-fl = no.\nDisplay vendor-num invoice-num posted-fl.\n\nIf anything is returned, consult the lead.' },
          { table: 'mb', field: 'DPs & LNs Without MB', stec: 'mb-num', comments: 'Find DP\'s & LN\'s that are not attached to a mb-num, go to Progress and type:\n\nRun: for each dp where dp.cu = 1:\n  find first mb where \n     mb.cu = 1 and\n     mb.mb-num = dp.mb-num\n     no-lock no-error.\n\n     If not avail mb then do:\n     display\n      dp.mb-num.\n    end. /* not avail mb */\nend. /* for each dp */\n\nRun: for each ln where ln.cu = 1:\n  find first mb where \n     mb.cu = 1 and\n     mb.mb-num = ln.mb-num\n     no-lock no-error.\n\n     If not avail mb then do:\n     display\n      ln.mb-num.\n    end. /* not avail mb */\nend. /* for each ln */\n\nNote: If any records are found, consult the Lead and/or Quality Analyst for guidance.' },
          { table: 'mb', field: 'Business Member Type', stec: 'mb-type', comments: 'This command checks for the member type of "BUS" (for business) to see if it has been converted. Go to Progress and type:\n\nRun: for each mb where mb.cu = 1 and mb-type = "BUS" no-lock.\nDisplay mb-num mb-type.\n\nIf nothing is returned, confirm with the lead that there shouldn\'t be any.' },
          { table: 'ln', field: 'Zero Balance Active Conv Loans', stec: 'curr-bal-amt', comments: 'This command will find conventional loans that are not LOC\'s that still have an active status but have a zero balance. These most likely are closed loans.\n\nRun: for each ln where open-end-review-fl <> yes and curr-bal-amt = 0 and\nstatus-cd <> "C" no-lock.\ndisplay mb-num ln-num ln-type status-cd.\n\nIf any loans are found, consult the lead.' },
          { table: 'ln', field: 'Zero Balance LOC Active', stec: 'credit-limit-amt', comments: 'This command will find LOC\'s that have a zero balance, zero credit limit amount and are still active. These most likely are closed LOC\'s.\n\nRun: for each ln where open-end-review-fl = yes and curr-bal-amt = 0 and\ncredit-limit-amt = 0 and status-cd <> "C" no-lock.\ndisplay mb-num ln-num ln-type curr-bal-amt credit-limit-amt status-cd.\n\nIf any loans are found, consult the lead.' },
          { table: 'ln', field: 'LOC Balance No Credit Limit', stec: 'credit-limit-amt', comments: 'This command will find LOC\'s that have a balance but no credit limit amount. There will be an error in mb tx\'s if they try to do an advance on any of these. The solution depends on how the CU wants to handle them.\n\nRun: for each ln where open-end-review-fl = yes and curr-bal-amt > 0 and\ncredit-limit-amt = 0 no-lock.\ndisplay mb-num ln-num ln-type curr-bal-amt credit-limit-amt status-cd.\n\nIf any loans are found, consult the lead.' },
          { table: 'ln', field: 'Zero Original Loan Amount', stec: 'orig-ln-amt', comments: 'This command is for all loans and displays any/all loans that have an original loan amount of 0 (This may be okay for LOC\'s but usually not the case for non-LOC\'s).\n\nRun: for each ln where orig-ln-amt = 0 no-lock.\ndisplay mb-num ln-num orig-ln-amt status-cd.\n\nIf any loans are found, consult the lead.' },
          { table: 'dp', field: 'Members Without Prime Share', stec: 'type', comments: 'Find Members without Prime Share Accounts. Go to Progress and type:\n\nRun: Find first cu.\n\nfor each mb where mb.cu = 1 and status-cd <> "c" and mb.mb-type = "M".\nfind first dp where dp.cu = 1 and dp.mb-num = mb.mb-num and dp.type =\ncu.main-acct-type no-lock no-error.\n\nif not avail dp then display mb.mb-num mb.mb-type.\nend.\n\nIf any members are returned, work with the Lead and/or Quality Analyst for a resolution.' },
          { table: 'dp', field: 'Transfer Club Accounts Missing Destination', stec: 'cert-renewal-cd', comments: 'This command is for shares that have a cert-renewal-cd of transfer (club accounts) that DO NOT have the transfer account specified.\n\nRun: for each dp where dp.cu = 1 and grp-type <> "CD" and grp-type <> "IRAC" and cert-renewal-cd = "T" no-lock.\ndisplay mb-num div-post-mb-num div-post-type.\n\nIf you see any blanks consult the lead.' },
          { table: 'dp', field: 'Retain CD/IRAC Blank Out Div-Post Fields', stec: 'div-post-mb-num', comments: 'This command will blank out the div-post-mb-num and div-post-type for all dp\'s that have "retain" and "retain" for both cert renewal and div postings.\n\nRun: for each dp where cert-renewal-cd = "R" and div-post-cd = "R" and (grp-type = "cd" or grp-type = "irac").\ndisplay mb-num cert-renewal-cd div-post-cd div-post-mb-num div-post-type.\nassign div-post-mb-num = 0.\nassign div-post-type = "".\n\nNote: The conversion program is most likely assigning these. So if you find any items with this command, keep in mind that they will go back to being incorrect if the conversion program is ran again.' },
          { table: 'dp-hold', field: 'Hold Types Not Built', stec: 'hold-type', comments: 'Try to identify Hold Types that are not built on the system. Go to Progress and type:\n\nRun: for each dp-hold where dp-hold.cu = 1 and hold-type = "".\nDisplay mb-num hold-type descrip.\n\nIf any items appear add the hold type in Admin WS / Application Controls / Deposit Hold Types (Conversion Box).' },

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatComments(raw) {
  if (!raw) return '';
  // Split on explicit "Run:" markers first
  const runParts = raw.split(/(?=Run:)/g);
  return runParts.map(part => {
    if (part.startsWith('Run:')) {
      const rest = part.slice(4).replace(/^\s*\n?/, '');
      const paragraphs = rest.split(/\n\n+/);
      // Code keywords — a paragraph starting with these stays inside the code block
      const codeKw = /^(for each|find first|find |display|where |and |or |no-lock|assign |end\.|end\s|end$|if avail|if not avail|do:|do\.|\s*\/\*|\s*end\b)/i;
      const cmdParts = [];
      const afterParts = [];
      let codeOver = false;
      for (const para of paragraphs) {
        const firstLine = para.trim().split('\n')[0].trim();
        if (!codeOver && (cmdParts.length === 0 || codeKw.test(firstLine))) {
          cmdParts.push(para);
        } else {
          codeOver = true;
          afterParts.push(para);
        }
      }
      const cmd = cmdParts.join('\n\n');
      const cmdHtml = `<span class="run-label">▶ Run:</span><code class="run-code">${escHtml(cmd.trim())}</code>`;
      const afterHtml = afterParts.length ? processForEach(afterParts.join('\n\n')) : '';
      return cmdHtml + afterHtml;
    } else {
      return processForEach(part);
    }
  }).join('');
}

// Detects "for each" Progress commands within free text and renders them as code blocks
function processForEach(text) {
  if (!text) return '';
  const lines = text.split('\n');
  let html = '';
  let i = 0;

  // Prose-start pattern: lines that are clearly English instructions, not Progress code
  const proseRe = /^(If |Note:|This |These |The |All |Make |Check |Go to|To |Verify|Please |Also |Only |Most |Should |Must |Warning|A |An |At |Do |Be |So |With |When |After |Before |Because |Once |Find results|Some |Many |Each |Review|Consult|Return|Submit|Right-click)/i;
  // Progress code continuation lines
  const codeRe = /^(for each|find first|find |display|where |and |or |no-lock|assign |end\.|if avail|if not avail|do:|end\s|\/\*)/i;

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    if (/^for each\b/i.test(trimmed)) {
      // Collect all lines belonging to this command block
      const cmdLines = [trimmed];
      i++;
      while (i < lines.length) {
        const next = lines[i].trim();
        if (next === '') break;                         // blank line → end of command
        if (proseRe.test(next) && !codeRe.test(next)) break; // prose line → end of command
        cmdLines.push(next);
        i++;
      }
      html += `<span class="run-label">▶ Run:</span><code class="run-code">${escHtml(cmdLines.join('\n'))}</code>`;
    } else {
      html += escHtml(line) + (i < lines.length - 1 ? '<br>' : '');
      i++;
    }
  }
  return html;
}

function updateRoundLabel() {
  const round = document.querySelector('input[name="cu-round"]:checked')?.value || '1st';
  document.title = `Sharetec Data Verification — ${round} Round`;
}

// INTERACTIONS

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
  document.getElementById('toolbar').style.display = (id === 'workflow') ? 'none' : '';
}

function toggleSection(card, header) {
  const body = card.querySelector('.section-body');
  const collapsed = header.classList.toggle('collapsed');
  body.style.display = collapsed ? 'none' : '';
}

function expandAll() {
  document.querySelectorAll('.section-header').forEach(h => {
    h.classList.remove('collapsed');
    h.closest('.section-card').querySelector('.section-body').style.display = '';
  });
}

function collapseAll() {
  document.querySelectorAll('.section-header').forEach(h => {
    h.classList.add('collapsed');
    h.closest('.section-card').querySelector('.section-body').style.display = 'none';
  });
}

function setStatus(sel) {
  const fid = sel.dataset.fid;
  const val = sel.value;
  fieldData[fid].status = val;
  const tr = document.getElementById('row-' + fid);
  tr.className = val ? 'row-' + val : '';
  sel.className = 'status-sel ' + (val || 'pending');
  updateCounts();
}

function setVal(inp) {
  const { fid, idx } = inp.dataset;
  fieldData[fid].values[parseInt(idx)] = inp.value;
}

function setSectionComment(ta) {
  const sid = ta.dataset.sid;
  if (sectionData[sid] !== undefined) sectionData[sid].comment = ta.value;
}

function setNotes(ta) {
  fieldData[ta.dataset.fid].notes = ta.value;
}

function setJira(inp) {
  fieldData[inp.dataset.fid].jira = inp.value;
}

function updateCounts() {
  const all = Object.values(fieldData);
  const pass = all.filter(f => f.status === 'pass').length;
  const fail = all.filter(f => f.status === 'fail').length;
  const na = all.filter(f => f.status === 'na').length;
  const cnv = all.filter(f => f.status === 'cnv').length;
  const pending = all.filter(f => f.status === '').length;
  const total = all.length;
  const verified = pass + fail + na + cnv;

  document.getElementById('cnt-pass').textContent = pass;
  document.getElementById('cnt-fail').textContent = fail;
  document.getElementById('cnt-na').textContent = na;
  document.getElementById('cnt-cnv').textContent = cnv;
  document.getElementById('cnt-pending').textContent = pending;

  const pct = total ? Math.round(verified / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `Overall Progress: ${verified} / ${total} verified (${pct}%)`;
}

function exportSummary() {
  const cu = document.getElementById('cu-name').value || '[CU Name]';
  const analyst = document.getElementById('analyst').value || '[Analyst]';
  const date = document.getElementById('verif-date').value || '[Date]';
  const round = document.querySelector('input[name="cu-round"]:checked')?.value || '1st';

  const all = Object.values(fieldData);
  const pass = all.filter(f=>f.status==='pass').length;
  const fail = all.filter(f=>f.status==='fail').length;
  const na = all.filter(f=>f.status==='na').length;
  const cnv = all.filter(f=>f.status==='cnv').length;
  const pending = all.filter(f=>f.status==='').length;

  // Collect failures
  let failures = '';
  let fi = 0;
  TABS.forEach(tab => tab.sections.forEach(sec => sec.fields.forEach(f => {
    const fid = 'f' + fi;
    if (fieldData[fid] && fieldData[fid].status === 'fail') {
      const jira = fieldData[fid].jira ? ` [${fieldData[fid].jira}]` : '';
      failures += `\n  ❌ [${tab.title}] ${f.field} (${f.table}.${f.stec||''})${jira}: ${fieldData[fid].notes || 'No notes'}`;
    }
    fi++;
  })));

  const summary = `SHARETEC DATA VERIFICATION SUMMARY
=====================================
Credit Union: ${cu}
Analyst: ${analyst}
Date: ${date}
Round: ${round}

RESULTS
-------
✅ Pass:    ${pass}
❌ Fail:    ${fail}
N/A:        ${na}
🔍 CNV:     ${cnv}
⏳ Pending: ${pending}
Total:      ${all.length}

FAILED ITEMS${failures || '\n  None'}
`;
  alert(summary);
}

// ─── INIT ───
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('verif-date').value = new Date().toISOString().slice(0,10);
  buildUI();
  // Hide toolbar if starting on workflow tab
  const firstTabId = TAB_ORDER[0];
  if (firstTabId === 'workflow') document.getElementById('toolbar').style.display = 'none';
});

function applySessionToDOM() {
  // Restore status selects + row styling
  document.querySelectorAll('select.status-sel').forEach(sel => {
    const d = fieldData[sel.dataset.fid];
    if (!d) return;
    sel.value = d.status || '';
    sel.className = 'status-sel ' + (d.status || 'pending');
    const tr = document.getElementById('row-' + sel.dataset.fid);
    if (tr) tr.className = d.status ? 'row-' + d.status : '';
  });
  // Restore notes
  document.querySelectorAll('textarea.notes-ta').forEach(ta => {
    const d = fieldData[ta.dataset.fid];
    if (d) ta.value = d.notes || '';
  });
  // Restore jira tickets
  document.querySelectorAll('input.jira-val').forEach(inp => {
    const d = fieldData[inp.dataset.fid];
    if (d) inp.value = d.jira || '';
  });
  // Restore member values (Mb1–Mb5)
  document.querySelectorAll('input.mb-val').forEach(inp => {
    const d = fieldData[inp.dataset.fid];
    if (d && d.values) inp.value = d.values[parseInt(inp.dataset.idx)] || '';
  });
  // Restore section comments
  document.querySelectorAll('textarea.section-comment').forEach(ta => {
    const d = sectionData[ta.dataset.sid];
    if (d) ta.value = d.comment || '';
  });
  updateCounts();
}

function saveSession() {
  const cuName = document.getElementById('cu-name').value.trim() || 'CU';
  const payload = {
    version: 1,
    cuName: cuName,
    cuRound: document.querySelector('input[name="cu-round"]:checked')?.value || '1st',
    cuAnalyst: document.getElementById('analyst').value.trim(),
    cuDate: document.getElementById('verif-date').value,
    savedAt: new Date().toISOString(),
    fieldData: fieldData,
    sectionData: sectionData
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = cuName.replace(/[^a-zA-Z0-9_-]/g,'_') + '_session_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function loadSession(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const payload = JSON.parse(e.target.result);
      if (!payload.fieldData) throw new Error('Invalid session file.');
      // Restore CU name
      if (payload.cuName) document.getElementById('cu-name').value = payload.cuName;
      // Restore fieldData and sectionData
      Object.assign(fieldData, payload.fieldData);
      if (payload.sectionData) Object.assign(sectionData, payload.sectionData);
      // Restore header fields
      if (payload.cuName) document.getElementById('cu-name').value = payload.cuName;
      if (payload.cuRound) {
        const rb = document.querySelector('input[name="cu-round"][value="' + payload.cuRound + '"]');
        if (rb) { rb.checked = true; updateRoundLabel(); }
      }
      if (payload.cuAnalyst !== undefined) document.getElementById('analyst').value = payload.cuAnalyst;
      if (payload.cuDate) document.getElementById('verif-date').value = payload.cuDate;
      // Re-render all field DOM elements
      applySessionToDOM();
      alert('Session loaded successfully!\nSaved: ' + (payload.savedAt ? new Date(payload.savedAt).toLocaleString() : 'unknown'));
    } catch(err) {
      alert('Could not load session: ' + err.message);
    }
    // Reset file input so same file can be re-loaded if needed
    event.target.value = '';
  };
  reader.readAsText(file);
}


function mergeSessions(event) {
  const files = Array.from(event.target.files);
  if (!files.length) return;
  event.target.value = '';

  const STATUS_RANK = { 'pass': 3, 'fail': 3, 'na': 3, 'n/a': 3, 'cnv': 3, 'pending': 1, '': 0 };

  function readFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        try { resolve(JSON.parse(e.target.result)); }
        catch(err) { reject(new Error('Could not parse ' + file.name + ': ' + err.message)); }
      };
      reader.readAsText(file);
    });
  }

  Promise.all(files.map(readFile)).then(payloads => {
    // Validate all files
    for (const p of payloads) {
      if (!p.fieldData) throw new Error('One or more files is not a valid session.');
    }

    // Sort payloads oldest-first so newer data wins ties
    payloads.sort((a, b) => new Date(a.savedAt || 0) - new Date(b.savedAt || 0));

    // Start with a deep copy of the first payload's fieldData
    const merged = JSON.parse(JSON.stringify(payloads[0].fieldData));

    // Merge each subsequent payload
    for (let i = 1; i < payloads.length; i++) {
      const src = payloads[i].fieldData;
      for (const key of Object.keys(src)) {
        if (!merged[key]) {
          merged[key] = JSON.parse(JSON.stringify(src[key]));
          continue;
        }
        const base = merged[key];
        const incoming = src[key];

        // Status: higher rank wins; equal rank → incoming (newer) wins
        const baseRank = STATUS_RANK[(base.status || '').toLowerCase()] || 0;
        const inRank   = STATUS_RANK[(incoming.status || '').toLowerCase()] || 0;
        if (inRank >= baseRank) base.status = incoming.status;

        // Notes: concatenate if both non-empty and different
        const baseNote = (base.notes || '').trim();
        const inNote   = (incoming.notes || '').trim();
        if (inNote && inNote !== baseNote) {
          base.notes = baseNote ? baseNote + ' | ' + inNote : inNote;
        }

        // Jira: concatenate unique tickets
        const baseJira = (base.jira || '').trim();
        const inJira   = (incoming.jira || '').trim();
        if (inJira && inJira !== baseJira) {
          base.jira = baseJira ? baseJira + ', ' + inJira : inJira;
        }

        // Values (Mb1-Mb5): non-empty incoming wins over empty base
        if (incoming.values && incoming.values.length) {
          if (!base.values) base.values = [];
          incoming.values.forEach((v, idx) => {
            if (v && v.trim() && !(base.values[idx] && base.values[idx].trim())) {
              base.values[idx] = v;
            }
          });
        }
      }
    }

    // Apply merged data to live fieldData
    Object.assign(fieldData, merged);

    // Merge section comments (concatenate unique values)
    const mergedSections = JSON.parse(JSON.stringify(payloads[0].sectionData || {}));
    for (let i = 1; i < payloads.length; i++) {
      const src = payloads[i].sectionData || {};
      for (const sid of Object.keys(src)) {
        if (!mergedSections[sid]) { mergedSections[sid] = { comment: '' }; }
        const baseC = (mergedSections[sid].comment || '').trim();
        const inC = (src[sid].comment || '').trim();
        if (inC && inC !== baseC) {
          mergedSections[sid].comment = baseC ? baseC + ' | ' + inC : inC;
        }
      }
    }
    Object.assign(sectionData, mergedSections);

    // Use CU name/round/analyst/date from the newest file
    const newest = payloads[payloads.length - 1];
    if (newest.cuName) document.getElementById('cu-name').value = newest.cuName;
    if (newest.cuRound) {
      const rb = document.querySelector('input[name="cu-round"][value="' + newest.cuRound + '"]');
      if (rb) { rb.checked = true; updateRoundLabel(); }
    }
    if (newest.cuAnalyst !== undefined) document.getElementById('analyst').value = newest.cuAnalyst;
    if (newest.cuDate) document.getElementById('verif-date').value = newest.cuDate;

    // Re-render all field DOM elements
    applySessionToDOM();

    alert('Merged ' + files.length + ' session files successfully!\n\nConflict rules applied:\n\u2022 Pass/Fail/N/A/CNV always wins over Pending\n\u2022 Notes and Jira tickets from all users are combined\n\u2022 Member values: non-empty entries fill empty slots\n\nSave the merged session to keep the combined result.');
  }).catch(err => {
    alert('Merge failed: ' + err.message);
  });
}


function exportToExcel() {
  function xmlEsc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function makeSheet(name, headers, rows) {
    let xml = '<Worksheet ss:Name="' + xmlEsc(name.substring(0,31)) + '">\n<Table>\n';
    xml += '<Row>' + headers.map(h =>
      '<Cell ss:StyleID="hdr"><Data ss:Type="String">' + xmlEsc(h) + '</Data></Cell>'
    ).join('') + '</Row>\n';
    rows.forEach(r => {
      xml += '<Row>' + r.map(c =>
        '<Cell><Data ss:Type="String">' + xmlEsc(c) + '</Data></Cell>'
      ).join('') + '</Row>\n';
    });
    xml += '</Table>\n</Worksheet>\n';
    return xml;
  }

  const hdrs = ['Section','Table','Field Name','STEC Field','Instructions / Comments','Mb1','Mb2','Mb3','Mb4','Mb5','Status','Notes','Jira Ticket #'];
  let sheets = '';

  TABS.forEach(tab => {
    if (tab._isWorkflow) return;
    const rows = [];
    (tab.sections || []).forEach(sec => {
      (sec.fields || []).forEach(field => {
        const key = field._key;
        const d = (key && fieldData[key]) ? fieldData[key] : {};
        rows.push([
          sec.title || '',
          field.table || '',
          field.field || '',
          field.stec || '',
          field.comments || '',
          (d.values && d.values[0]) || '',
          (d.values && d.values[1]) || '',
          (d.values && d.values[2]) || '',
          (d.values && d.values[3]) || '',
          (d.values && d.values[4]) || '',
          d.status || 'Pending',
          d.notes || '',
          d.jira || '',
        ]);
      });
    });
    sheets += makeSheet(tab.label || tab.id, hdrs, rows);
  });

  const cuName = document.getElementById('cu-name').value.trim() || 'Export';
  const date = new Date().toISOString().slice(0,10);

  const xml = '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<?mso-application progid="Excel.Sheet"?>\n'
    + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"\n'
    + ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n'
    + '<Styles>\n'
    + '<Style ss:ID="hdr"><Interior ss:Color="#071960" ss:Pattern="Solid"/>'
    + '<Font ss:Color="#FFFFFF" ss:Bold="1"/></Style>\n'
    + '</Styles>\n'
    + sheets
    + '</Workbook>';

  const blob = new Blob([xml], {type: 'application/vnd.ms-excel'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = cuName.replace(/[^a-zA-Z0-9_-]/g,'_') + '_verification_' + date + '.xls';
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>

<script>
window.addEventListener('beforeprint', function() {
  document.querySelectorAll('input.mb-val').forEach(function(inp) {
    var span = document.createElement('span');
    span.className = 'print-val';
    span.textContent = inp.value || '';
    inp.parentNode.insertBefore(span, inp);
    inp.style.display = 'none';
  });
  document.querySelectorAll('select.status-sel').forEach(function(sel) {
    var span = document.createElement('span');
    span.className = 'print-val';
    span.textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
    sel.parentNode.insertBefore(span, sel);
    sel.style.display = 'none';
  });
  document.querySelectorAll('textarea.notes-ta').forEach(function(ta) {
    var div = document.createElement('div');
    div.className = 'print-val print-notes';
    div.textContent = ta.value || '';
    ta.parentNode.insertBefore(div, ta);
    ta.style.display = 'none';
  });
});
window.addEventListener('afterprint', function() {
  document.querySelectorAll('.print-val').forEach(function(el) { el.remove(); });
  document.querySelectorAll('input.mb-val, select.status-sel, textarea.notes-ta').forEach(function(el) {
    el.style.display = '';
  });
});
</script>
