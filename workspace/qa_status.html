<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; max-width: 480px; width: 90%; border: 1px solid #e2e8f0; }
    .spinner { width: 48px; height: 48px; border: 5px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { color: #0f172a; margin: 0 0 12px; font-size: 22px; font-weight: bold; }
    p { color: #475569; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    .badge { background: #eff6ff; color: #1d4ed8; padding: 10px 18px; border-radius: 20px; display: inline-block; font-size: 13px; font-weight: bold; border: 1px solid #bfdbfe; }
    .note { color: #94a3b8; font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Xác Nhận QA Thành Công!</h2>
    <p>Quyết định QA đã được ghi nhận. Hệ thống <b>BSDC Ingest Engine</b> đang tiếp tục xử lý dữ liệu trong nền.</p>
    <div class="badge">⚡ Status: Pipeline Is Running...</div>
    <div class="note">Anh có thể đóng tab trình duyệt này an toàn. Kết quả sẽ tự động gửi qua Email sau khi hoàn tất.</div>
  </div>
</body>
</html>
